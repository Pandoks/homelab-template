apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: main
resources:
  - certs.yaml
  - main-patroni.yaml
  - backup.yaml
  - pgcat.yaml
configMapGenerator:
  - name: pgcat-main-config
    files:
      - ../../../packages/postgres/images/pgcat/pgcat.toml
  - name: pgbackrest-server-config
    files:
      - ../../../packages/postgres/images/backup/pgbackrest.conf
      - ../../../packages/postgres/images/backup/cron
  - name: patroni-config
    files:
      - ../../../packages/postgres/images/patroni/patroni.yaml
      - ../../../packages/postgres/images/patroni/pgbackrest.conf
generatorOptions:
  disableNameSuffixHash: false # changes the suffix hash of names so services automatically reload
