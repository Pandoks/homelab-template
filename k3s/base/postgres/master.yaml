apiVersion: v1
kind: Service
metadata:
  name: main-postgres-master-service
  labels:
    app: main-postgres-master

spec:
  ports:
    - port: 5432
      targetPort: 5432

  clusterIP: None
  selector:
    app: main-postgres-master

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: main-postgres-master

spec:
  serviceName: main-postgres-master-service
  replicas: 1
  selector:
    matchLabels:
      app: main-postgres-master

  volumeClaimTemplates:
    - metadata:
        name: main-postgres-master-data

      spec:
        accessMode: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

  template:
    metadata:
      labels:
        app: main-postgres-master

    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB # TODO: change for prod
              value: "main"
            - name: PGDATABASE
              value: "main"

          ports:
            - containerPort: 5432

          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/0001_init.sql
            - name: roles-sql
              mountPath: /docker-entrypoint-initdb.d/0002_roles.sql

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - admin
                - -d
                - main
            initialDelaySeconds: 5
            periodSeconds: 1

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - admin
                - -d
                - main
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: init-sql
          hostPath:
            path: /postgres/packages/core/src/database/main/setup/0001_init.sql
            type: File
        - name: roles-sql
          hostPath:
            path: /postgres/packages/core/src/database/main/setup/0002_roles.sql
            type: File
