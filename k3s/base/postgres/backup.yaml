apiVersion: v1
kind: Service
metadata:
  name: pgbackrest-backup-service
  namespace: main
  labels:
    app: pg-backup
spec:
  ports:
    - port: 8432
      targetPort: 8432
  selector:
    app: pg-backup

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbackrest-backup
  namespace: main
  labels:
    app: pg-backup
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-backup
  template:
    metadata:
      labels:
        app: pg-backup
    spec:
      containers:
        - name: pg-backup
          image: local-registry:12345/backup:latest
          env:
            - name: POSTGRES_DB_1
              value: main
            - name: MASTER_HOST_1
              value: patroni-main-primary.main.svc.cluster.local
            - name: SLAVE_HOST_1
              value: patroni-main-replica.main.svc.cluster.local
            - name: MAIN_ENCRYPTION_KEY
              value: openssl-rand-hex-32
          volumeMounts:
            - name: pgbackrest-ca-cert
              mountPath: /etc/pgbackrest/ca.crt
              subPath: tls.crt
            - name: pgbackrest-server-tls
              mountPath: /etc/pgbackrest/server.crt
              subPath: tls.crt
            - name: pgbackrest-server-tls
              mountPath: /etc/pgbackrest/server.key
              subPath: tls.key
            - name: pgbackrest-conf
              mountPath: /tmp/conf_templates/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true
            - name: pgbackrest-conf
              mountPath: /etc/cron.d/backup-schedule
              subPath: cron
              readOnly: true
      volumes:
        - name: pgbackrest-ca-cert
          secret:
            secretName: internal-root-ca-secret
            defaultMode: 0600
        - name: pgbackrest-server-tls
          secret:
            secretName: pgbackrest-backup-tls
            defaultMode: 0600
        - name: pgbackrest-conf
          configMap:
            name: pgbackrest-server-config
