# Headless Service for Patroni StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: patroni-main
  namespace: main
  labels:
    app: patroni-main
spec:
  clusterIP: None
  selector:
    app: patroni-main
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
    - name: patroni
      port: 8008
      targetPort: 8008
---
# StatefulSet for Patroni-managed PostgreSQL cluster
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: patroni-main
  namespace: main
  labels:
    app: patroni-main
spec:
  serviceName: patroni-main  # Must match the Service name above
  replicas: 2               # Primary + one replica
  selector:
    matchLabels:
      app: patroni-main
  template:
    metadata:
      labels:
        app: patroni-main
    spec:
      securityContext:
        fsGroup: 1000  # Ensure proper file permissions for volumes
      containers:
        - name: patroni
          image: local-registry:12345/patroni:latest  # Use the locally built Patroni image
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
            - name: patroni
              containerPort: 8008
          env:
            - name: POSTGRES_DB
              value: main  # Database name to manage and bootstrap
            - name: PATRONI_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace  # Namespace of the pod
            - name: PATRONI_KUBERNETES_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name      # Pod name for this node
            - name: PATRONI_KUBERNETES_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP       # Pod IP address for DCS and replication
          envFrom:
            - secretRef:
                name: env  # Import environment variables from 'env' Secret (includes credentials & S3 config)
          volumeMounts:
            - name: pgbackrest-ca
              mountPath: /etc/pgbackrest/ca.crt
              subPath: tls.crt
            - name: pgbackrest-server-tls
              mountPath: /etc/pgbackrest/server.crt
              subPath: tls.crt
            - name: pgbackrest-server-tls
              mountPath: /etc/pgbackrest/server.key
              subPath: tls.key
            - name: patroni-data
              mountPath: /var/lib/postgresql/data  # PostgreSQL data directory
      volumes:
        - name: pgbackrest-ca
          secret:
            secretName: internal-root-ca-secret
            defaultMode: 0600
        - name: pgbackrest-server-tls
          secret:
            secretName: pgbackrest-backup-tls
            defaultMode: 0600
  volumeClaimTemplates:
    - metadata:
        name: patroni-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
