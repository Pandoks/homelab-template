apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: patroni-main
  namespace: main
  labels:
    app: patroni-main
spec:
  replicas: 3
  selector:
    matchLabels:
      app: patroni-main
  template:
    metadata:
      labels:
        app: patroni-main
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: patroni-main
          image: local-registry:12345/patroni:latest
          env:
            - name: POSTGRES_DB
              value: main
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - secretRef:
                name: env
          volumeMounts:
            - name: pgbackrest-ca
              mountPath: /etc/pgbackrest/ca.crt
              subPath: tls.crt
            - name: pgbackrest-server-tls
              mountPath: /etc/pgbackrest/server.crt
              subPath: tls.crt
            - name: pgbackrest-server-tls
              mountPath: /etc/pgbackrest/server.key
              subPath: tls.key
            - name: patroni-main-config
              mountPath: /tmp/conf_templates/patroni.yaml
              subPath: patroni.yaml
            - name: patroni-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgbackrest-ca
          secret:
            secretName: internal-root-ca-secret
            defaultMode: 0600
        - name: pgbackrest-server-tls
          secret:
            secretName: pgbackrest-backup-tls
            defaultMode: 0600
        - name: patroni-main-config
          configMap:
            name: patroni-main-config
  volumeClaimTemplates:
    - metadata:
        name: patroni-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
