apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbackrest-backup
  namespace: main
spec:
  template:
    spec:
      containers:
        - name: pg-backup
          volumeMounts:
            - name: pgbackrest-conf-volume
              mountPath: /tmp/conf_templates/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true
      volumes:
        - name: pgbackrest-conf-volume
          configMap:
            name: pgbackrest-main-config

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgcat-pooler
  namespace: main
spec:
  template:
    spec:
      containers:
        - name: pgcat
          volumeMounts:
            - name: pgcat-conf-volume
              mountPath: /tmp/conf_templates/pgcat.toml
              subPath: pgcat.toml
              readOnly: true
      volumes:
        - name: pgcat-conf-volume
          configMap:
            name: pgcat-main-config
