apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgcat-pooler
  namespace: main
  labels:
    app: pgcat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgcat
  template:
    metadata:
      labels:
        app: pgcat
    spec:
      containers:
        - name: pgcat
          image: local-registry:12345/pgcat:latest
          env:
            - name: POSTGRES_DB
              value: main
            - name: MASTER_HOST_1
              value: patroni-main
            - name: SLAVE_HOST_1
              value: patroni-main-replica
          volumeMounts:
            - name: pgcat-conf
              mountPath: /tmp/conf_templates/pgcat.toml
              subPath: pgcat.toml
              readOnly: true
      volumes:
        - name: pgcat-conf
          configMap:
            name: pgcat-main-config
