apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
data:
  postgresql.conf: |
    # Core settings
    listen_addresses = '*'
    port = 5432
    max_connections = 100
    shared_buffers = 128MB
    dynamic_shared_memory_type = posix
    max_wal_size = 1GB
    min_wal_size = 80MB
    
    # Logging
    log_destination = 'stderr'
    logging_collector = off
    log_min_messages = warning
    log_min_error_statement = error
    log_min_duration_statement = 1000
    log_line_prefix = '%m [%p] %q%u@%d '
    
    # Replication
    wal_level = replica
    max_wal_senders = 10
    hot_standby = on
    
  pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    local   all             postgres                                trust
    local   all             admin                                   trust
    host    all             admin           127.0.0.1/32            trust
    host    all             admin           ::1/128                 trust
    host    all             all             all                     md5
    host    replication     all             all                     md5
    
  pgbackrest.conf: |
    [global]
    repo1-host=s3
    repo1-host-user=pgbackrest
    repo1-type=s3
    repo1-s3-bucket=pgbackrest
    repo1-s3-endpoint=s3
    repo1-s3-region=us-west-1
    repo1-s3-key=test
    repo1-s3-key-secret=testsecret
    process-max=4
    log-level-console=info
    compress-type=lz4
    spool-path=/var/spool/pgbackrest
    
  pgcat.toml: |
    [general]
    host = "0.0.0.0"
    port = 6432
    admin_host = "0.0.0.0"
    admin_port = 6433
    
    [pools.main]
    pool_mode = "transaction"
    authentication_database = "postgres"
    idle_timeout = 300
    min_pool_size = 5
    default_role = "user"
    
    [pools.main.users]
    admin = "password"
    
    [pools.main.users.roles]
    admin = "admin"
    
    [pools.main.shards.0]
    servers = [{host = "postgres-master", port = 5432}, {host = "postgres-slave", port = 5432}]

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-scripts
data:
  0000_init.sql: |
    CREATE USER admin WITH SUPERUSER PASSWORD 'password';
    ALTER DATABASE main OWNER TO admin;
    
  0001_roles.sql: |
    CREATE ROLE anon NOLOGIN NOINHERIT;
    CREATE ROLE authenticated NOLOGIN NOINHERIT;
    
    CREATE ROLE service_role NOLOGIN NOINHERIT;
    GRANT service_role TO postgres;
    GRANT service_role TO admin;
    
    CREATE ROLE unverified NOLOGIN NOINHERIT;
    GRANT unverified TO authenticated;
    
    CREATE ROLE verified NOLOGIN NOINHERIT;
    GRANT verified TO authenticated;
    
    CREATE ROLE user_role NOLOGIN NOINHERIT;
    GRANT user_role TO authenticated;
    
    CREATE ROLE admin_role NOLOGIN NOINHERIT;
    GRANT admin_role TO authenticated;
    
  0002_extensions.sql: |
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE EXTENSION IF NOT EXISTS unaccent;
    
  0003_cron.sql: |
    CREATE EXTENSION IF NOT EXISTS pg_cron;

  master.sh: |
    #!/bin/bash
    set -e
    
    # Configuration for replication
    cat >> ${PGDATA}/postgresql.conf << EOF
    wal_level = replica
    max_wal_senders = 10
    hot_standby = on
    EOF
    
    # Allow replication connections
    cat >> ${PGDATA}/pg_hba.conf << EOF
    host replication replicator all md5
    EOF
    
    # Create replication user
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" << EOF
    CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD 'replication_pass';
    EOF
    
  setup_backups.sh: |
    #!/bin/bash
    set -e
    
    mkdir -p /var/lib/pgbackrest
    mkdir -p /var/log/pgbackrest
    mkdir -p /var/spool/pgbackrest
    
    # Create stanza
    pgbackrest --stanza=main stanza-create
    
    # Run initial backup
    pgbackrest --stanza=main backup
    
    # Set up cron job for backups
    echo "0 0 * * * pgbackrest --stanza=main backup" > /etc/cron.d/pgbackrest