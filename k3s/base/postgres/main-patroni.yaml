# headless service used so patroni stores config in k8s store instead of configmap.
# this prevents k8s from automatically deleting patroni's config endpoint if blank
apiVersion: v1
kind: Service
metadata:
  name: patroni-main-config
  namespace: main
  labels:
    app: patroni-main
    cluster-name: main
spec:
  clusterIP: None

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: patroni-main
  namespace: main
  labels:
    app: &app patroni-main
    cluster-name: &cluster-name main
spec:
  replicas: 3
  serviceName: patroni-main-primary
  selector:
    matchLabels:
      app: *app
      cluster-name: *cluster-name
  template:
    metadata:
      labels:
        app: *app
        cluster-name: *cluster-name
    spec:
      serviceAccountName: patroni-main
      containers:
        - name: *app
          image: local-registry:12345/patroni:latest
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /readiness
              port: 8008
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          ports:
            - containerPort: 8008
              protocol: TCP
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: main
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - secretRef:
                name: env
          volumeMounts:
            - name: pgbackrest-conf
              mountPath: /tmp/conf_templates/pgbackrest.conf
              subPath: pgbackrest.conf
            - name: pgbackrest-ca
              mountPath: /etc/pgbackrest/ca.crt
              subPath: tls.crt
            - name: pgbackrest-server-tls
              mountPath: /etc/pgbackrest/server.crt
              subPath: tls.crt
            - name: pgbackrest-server-tls
              mountPath: /etc/pgbackrest/server.key
              subPath: tls.key
            - name: patroni-main-config
              mountPath: /tmp/conf_templates/patroni.yaml
              subPath: patroni.yaml
            - name: patroni-data
              mountPath: /var/lib/postgresql
            - name: patroni-init
              mountPath: /docker-entrypoint-initdb.d/master.sh
              subPath: master.sh
            - name: patroni-init
              mountPath: /docker-entrypoint-initdb.d/0000_init.sql
              subPath: 0000_init.sql
            - name: patroni-init
              mountPath: /docker-entrypoint-initdb.d/0001_roles.sql
              subPath: 0001_roles.sql
            - name: patroni-init
              mountPath: /docker-entrypoint-initdb.d/0002_extensions.sql
              subPath: 0002_extensions.sql
            - name: patroni-init
              mountPath: /docker-entrypoint-initdb.d/0003_cron.sql
              subPath: 0003_cron.sql
      volumes:
        - name: pgbackrest-ca
          secret:
            secretName: internal-root-ca-secret
            defaultMode: 0600
        - name: pgbackrest-server-tls
          secret:
            secretName: pgbackrest-backup-tls
            defaultMode: 0600
        - name: pgbackrest-conf
          configMap:
            name: pgbackrest-patroni-config
        - name: patroni-main-config
          configMap:
            name: patroni-main-config
        - name: patroni-init
          configMap:
            name: patroni-init
  volumeClaimTemplates:
    - metadata:
        name: patroni-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi

---
# endpoint that patroni will take over and attach the primary to
apiVersion: v1
kind: Endpoints
metadata:
  name: patroni-main-primary
  namespace: main
  labels:
    app: patroni-main
    cluster-name: main
subsets: []

---
# provides a stable ip for the primary endpoint above for when it changes
apiVersion: v1
kind: Service
metadata:
  name: &app patroni-main-primary
  namespace: main
  labels:
    app: patroni-main
    cluster-name: main
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432

---
# provides a stable ip for all replicas
apiVersion: v1
kind: Service
metadata:
  name: patroni-main-replica
  namespace: main
  labels:
    app: &app patroni-main
    cluster-name: &cluster-name main
    role: &role replica
spec:
  type: ClusterIP
  selector:
    app: *app
    cluster-name: *cluster-name
    role: *role
  ports:
    - port: 5432
      targetPort: 5432

---
# ---- below are permissions that patroni needs to get access to k8s API ----
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patroni-main
  namespace: main

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patroni-main
  namespace: main
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
      - delete
      - deletecollection
  - apiGroups:
      - ""
    resources:
      - endpoints
    verbs:
      - get
      - patch
      - update
      - create
      - list
      - watch
      - delete
      - deletecollection
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - patch
      - update
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patroni-main
  namespace: main
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: patroni-main
subjects:
  - kind: ServiceAccount
    name: patroni-main
    namespace: main
