apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: main
resources:
  - main-valkey.yaml
configMapGenerator:
  - name: valkey-config
    files:
      - ../../../packages/valkey/valkey.conf
generatorOptions:
  disableNameSuffixHash: false # changes the suffix hash of names so services automatically reload
