apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
secretGenerator:
  - name: env
    namespace: main
    envs:
      - ../../.env
generatorOptions:
  disableNameSuffixHash: false # changes the suffix hash of names so services automatically reload
patches:
  - path: env-patch.yaml
