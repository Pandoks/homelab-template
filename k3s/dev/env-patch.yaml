apiVersion: apps/v1
kind: Deployment
metadata:
  name: sveltekit-web-deployment
  namespace: main
spec:
  template:
    spec:
      containers:
        - name: web
          envFrom:
            - secretRef:
                name: env

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbackrest-backup
  namespace: main
spec:
  template:
    spec:
      containers:
        - name: pg-backup
          env:
            - name: S3_ENDPOINT
              value: s3.main.svc.cluster.local:4566
          envFrom:
            - secretRef:
                name: env

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: patroni-main
  namespace: main
spec:
  template:
    spec:
      containers:
        - name: patroni-main
          env:
            - name: S3_ENDPOINT
              value: s3.main.svc.cluster.local:4566
            - name: BACKUP_HOST
              value: pgbackrest-backup-service.main.svc.cluster.local
          envFrom:
            - secretRef:
                name: env

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgcat-pooler
  namespace: main
spec:
  template:
    spec:
      containers:
        - name: pgcat
          envFrom:
            - secretRef:
                name: env
